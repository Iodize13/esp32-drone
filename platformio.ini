[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
; keep DTR/RTS released: no reset on open, RST button boots normally
monitor_rts = 0
monitor_dtr = 0
upload_speed = 115200
; This board's flash (Spansion 01/2018) does not honour esptool's sector
; erase, so rewrites fail MD5. Always flash with a full chip erase (~40 s):
;   pio run -t erase -t upload -t monitor
